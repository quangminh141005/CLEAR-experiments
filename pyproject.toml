[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clear-med"
version = "0.1.0"
description = "Concept-Level Embeddings for Auditable Radiology"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "CLEAR Contributors" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["medical-imaging", "clip", "radiology", "zero-shot"]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.21",
    "pandas>=1.3",
    "pillow>=9.0",
    "tqdm>=4.64",
    "scikit-learn>=1.0",
    "scipy>=1.7",
    "h5py>=3.6",
    "ftfy>=6.1",
    "regex>=2021.8.3",
    "huggingface-hub>=0.20"
]

[project.optional-dependencies]
visualization = ["matplotlib>=3.5"]
test = [
    "build>=1.0",
    "pytest>=7.0"
]

[project.urls]
Paper = "https://doi.org/10.1038/s41551-026-01741-4"
Repository = "https://github.com/peterhan91/CLEAR"
Model = "https://huggingface.co/peterhan91/CLEAR"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
"clear" = ["*.gz"]
